<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Profil — Blast WA Personal</title>
<script src="config.js"></script>
<style>
  :root { --bg:#0b1220; --panel:#121a2b; --panel2:#0f1626; --line:#223; --text:#e6ecff; --muted:#8b97b8; --teal:#2DBDB6; --lime:#9ACF87; --danger:#ef4444; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .top img{height:24px}
  .top .t{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  h1{font-size:18px;font-weight:600;margin:0 0 4px}
  .who{color:var(--muted);font-size:13px;margin:0 0 22px}
  .who b{color:var(--text)}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
  input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:11px 12px;font-size:13px}
  input:focus{outline:none;border-color:var(--teal)}
  .btn{width:100%;background:var(--teal);color:#0b1220;border:0;padding:12px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;margin-top:18px}
  .btn:hover{filter:brightness(1.05)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:13px}
  .row a{color:var(--teal);text-decoration:none}
  .msg{font-size:12px;margin-top:12px;display:none}
  .msg.err{color:#fca5a5}
  .msg.ok{color:var(--lime)}
  .hint{font-size:11px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <img src="assets/majoo-logo.svg" alt="majoo" />
      <span class="t">Profil akun</span>
    </div>
    <h1>Ganti password</h1>
    <p class="who">Login sebagai <b id="who">—</b></p>

    <form id="form">
      <label>Password lama</label>
      <input type="password" id="cur" autocomplete="current-password" />
      <label>Password baru</label>
      <input type="password" id="nw" autocomplete="new-password" />
      <div class="hint">Minimal 6 karakter.</div>
      <label>Ulangi password baru</label>
      <input type="password" id="nw2" autocomplete="new-password" />
      <button type="submit" class="btn" id="submit">Simpan password baru</button>
    </form>
    <div class="msg" id="msg"></div>

    <div class="row">
      <a href="index.html">← Kembali ke app</a>
      <a href="#" id="signout">Sign out</a>
    </div>
  </div>

<script>
const API_BASE = (window.APP_CONFIG && window.APP_CONFIG.API_BASE) || '';
const $ = s => document.querySelector(s);
function apiFetch(path, opts = {}) { return fetch(API_BASE + path, { credentials: 'include', ...opts }); }

apiFetch('/api/me').then(r => r.json()).then(d => {
  if (!d || !d.user) { location.href = 'login.html'; return; }
  $('#who').textContent = d.user.email;
}).catch(() => { location.href = 'login.html'; });

$('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = $('#msg'); msg.style.display = 'none';
  const cur = $('#cur').value, nw = $('#nw').value, nw2 = $('#nw2').value;
  if (nw.length < 6) { msg.className = 'msg err'; msg.textContent = 'Password baru minimal 6 karakter.'; msg.style.display = 'block'; return; }
  if (nw !== nw2) { msg.className = 'msg err'; msg.textContent = 'Konfirmasi password tidak sama.'; msg.style.display = 'block'; return; }
  $('#submit').disabled = true;
  const fd = new FormData();
  fd.append('current_password', cur);
  fd.append('new_password', nw);
  try {
    const r = await apiFetch('/auth/change-password', { method: 'POST', body: fd });
    if (!r.ok) { msg.className = 'msg err'; msg.textContent = await r.text(); msg.style.display = 'block'; $('#submit').disabled = false; return; }
    msg.className = 'msg ok'; msg.textContent = '✅ Password berhasil diganti.'; msg.style.display = 'block';
    $('#form').reset();
  } catch (e) { msg.className = 'msg err'; msg.textContent = 'Gagal konek ke backend.'; msg.style.display = 'block'; }
  finally { $('#submit').disabled = false; }
});

$('#signout').addEventListener('click', async (e) => {
  e.preventDefault();
  await apiFetch('/auth/logout', { method: 'POST' });
  location.href = 'login.html';
});
</script>
</body>
</html>
