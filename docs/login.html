<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login — Blast WA Personal</title>
<script src="config.js"></script>
<style>
  :root { --bg:#0b1220; --panel:#121a2b; --panel2:#0f1626; --line:#223; --text:#e6ecff; --muted:#8b97b8; --teal:#2DBDB6; --lime:#9ACF87; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:40px;width:100%;max-width:420px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .logo{margin-bottom:24px}
  .logo img{width:140px;height:auto}
  h1{font-size:18px;font-weight:600;margin:0 0 8px}
  p.sub{color:var(--muted);font-size:13px;margin:0 0 28px}
  .btn-google{display:inline-flex;align-items:center;gap:12px;background:#fff;color:#1f2937;padding:12px 24px;border-radius:8px;text-decoration:none;font-weight:500;font-size:14px;transition:all .15s;border:0;cursor:pointer}
  .btn-google:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.3)}
  .btn-google svg{flex-shrink:0}
  .domain{margin-top:24px;color:var(--muted);font-size:11px}
  .domain code{background:var(--panel2);padding:2px 8px;border-radius:4px;color:var(--teal);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .divider{height:1px;background:var(--line);margin:24px 0}
  .tagline{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .err{color:#fca5a5;font-size:12px;margin-top:12px;display:none}
  .or{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:22px 0 16px}
  #pwForm{text-align:left}
  #pwForm input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:11px 12px;font-size:13px;margin-bottom:10px}
  #pwForm input:focus{outline:none;border-color:var(--teal)}
  .btn-login{width:100%;background:var(--teal);color:#0b1220;border:0;padding:12px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer}
  .btn-login:hover{filter:brightness(1.05)}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="assets/majoo-logo.svg" alt="majoo" />
    </div>
    <div class="tagline">Blast WA Personal</div>
    <div class="divider"></div>
    <h1>Login majoo</h1>
    <p class="sub">Masuk dengan email <code>@majoo.id</code> dan password. Audit log tercatat atas nama Anda.</p>
    <form id="pwForm">
      <input type="email" id="pwEmail" placeholder="Email (@majoo.id)" autocomplete="username" />
      <input type="password" id="pwPass" placeholder="Password" autocomplete="current-password" />
      <button type="submit" class="btn-login">Masuk</button>
    </form>
    <div class="domain">Hanya email <code>@majoo.id</code> yang diizinkan</div>
    <div class="err" id="err"></div>
  </div>

<script>
const API_BASE = (window.APP_CONFIG && window.APP_CONFIG.API_BASE) || '';
if (!API_BASE) {
  document.getElementById('err').style.display = 'block';
  document.getElementById('err').textContent = 'API_BASE belum diset di config.js — hubungi admin.';
}
// Login email + password
document.getElementById('pwForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('err');
  errEl.style.display = 'none';
  const fd = new FormData();
  fd.append('email', document.getElementById('pwEmail').value.trim());
  fd.append('password', document.getElementById('pwPass').value);
  try {
    const r = await fetch(API_BASE + '/auth/password-login', { method: 'POST', body: fd, credentials: 'include' });
    if (!r.ok) { errEl.textContent = await r.text(); errEl.style.display = 'block'; return; }
    location.href = 'index.html';
  } catch (e) { errEl.textContent = 'Gagal konek ke backend.'; errEl.style.display = 'block'; }
});

// Auto-redirect kalau sudah login (cookie valid via cross-site)
fetch(API_BASE + '/api/me', { credentials: 'include' })
  .then(r => r.json())
  .then(d => { if (d && d.user) location.href = 'index.html'; })
  .catch(() => {});
</script>
</body>
</html>
